<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0038FF"/>
      <stop offset="35%" stop-color="#0066FF"/>
      <stop offset="70%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#002299"/>
    </linearGradient>
    <linearGradient id="innerShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00144D"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#BEE3F8"/>
    </linearGradient>
    <radialGradient id="highlight" cx="45%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Centered 3D Metallic Infinity Loop -->
  <g transform="translate(150, 20)">
    <path d="M 100,55 C 122,18 180,18 180,55 C 180,92 122,92 100,55 C 78,18 20,18 20,55 C 20,92 78,92 100,55 Z"
          stroke="url(#blueGlow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100,55 C 122,26 172,26 172,55 C 172,84 122,84 100,55 C 78,26 28,26 28,55 C 28,84 78,84 100,55 Z"
          stroke="url(#innerShine)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100,55 C 122,29 167,29 167,55 C 167,81 122,81 100,55 C 78,29 33,29 33,55 C 33,81 78,81 100,55 Z"
          stroke="url(#highlight)" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Main Title: ChainIQ AI -->
  <text x="250" y="195" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F172A">Chain</tspan><tspan fill="#0066FF">IQ</tspan> <tspan fill="#64748B" font-weight="400">AI</tspan>
  </text>

  <!-- Subtitle: — AI-POWERED SUPPLY CHAIN DECISION INTELLIGENCE — -->
  <g transform="translate(0, 230)">
    <line x1="50" y1="0" x2="100" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <text x="250" y="4" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">
      AI-POWERED SUPPLY CHAIN DECISION INTELLIGENCE
    </text>
    <line x1="400" y1="0" x2="450" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
